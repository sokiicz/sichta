name = "sichta"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# Na free plánu jsou dostupné jen DO se SQLite backendem a storage se neúčtuje.
[[durable_objects.bindings]]
name = "MISTNOST"
class_name = "Mistnost"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mistnost"]

# Statickou appku servíruje ten samý worker. Požadavky, které sednou na
# soubor v dist, se k workeru vůbec nedostanou, zbytek spadne do fetch().
# Appka i API tak sdílí adresu a CORS vůbec nevzniká.
[assets]
directory = "./dist"
binding = "SOUBORY"

# Měření chování, viz docs/mereni.md. Bez cookies, bez třetích stran.
[[analytics_engine_datasets]]
binding = "ANALYTIKA"
dataset = "sichta_udalosti"

[observability]
enabled = true
